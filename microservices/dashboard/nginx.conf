server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # no revela la versión de Nginx y fija cabeceras de seguridad básicas.
    # (always = también en respuestas 401/403/503). Sin CSP para no romper el SPA.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------
    # Backend: /api/v1/* -> ingesta
    # --------------------------------------------------
    location ^~ /api/v1/ {
        proxy_pass http://ingesta-service:8000/api/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # el JWT del frontend viaja tal cual hasta el servicio (sin que el
        # navegador conozca direcciones internas). Si no hay header, no se envía.
        proxy_set_header Authorization     $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        error_page 502 503 504 = @backend_unavailable;
    }

    # --------------------------------------------------
    # Compatibilidad con rutas /api/*
    # --------------------------------------------------
    location /api/ {
        proxy_pass http://ingesta-service:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        error_page 502 503 504 = @backend_unavailable;
    }

    # --------------------------------------------------
    # System Controller: /control-api/*
    #
    # /control-api/status
    # -> /api/v1/system/status
    #
    # /control-api/components/{name}/restart
    # -> /api/v1/system/components/{name}/restart
    # --------------------------------------------------
    location ^~ /control-api/ {
        # el Controller solo usa GET y POST.
        limit_except GET POST {
            deny all;
        }

        proxy_pass http://system-controller-service:8000/api/v1/system/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        error_page 502 503 504 = @controller_unavailable;
    }

    # Errores de servicios
    location @backend_unavailable {
        default_type application/json;
        return 503 '{"detail":"Backend no disponible"}';
    }

    location @controller_unavailable {
        default_type application/json;
        return 503 '{"detail":"System Controller no disponible"}';
    }

    # rutas internas de los servicios que NO deben verse desde el Gateway.
    # Sin esto caerían al SPA (200 + index.html).
    location ~ ^/(docs|redoc|openapi\.json|health|ready)$ {
        return 404;
    }

    # Dashboard React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}