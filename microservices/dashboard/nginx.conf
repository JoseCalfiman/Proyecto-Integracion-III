server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ---------- Backend: /api/v1/* -> ingesta ----------
    # "^~" evita que la regla de archivos estáticos (más abajo) se
    # robe una ruta de la API que termine en .js, .png, etc.
    location ^~ /api/v1/ {
        proxy_pass http://ingesta-service:8000/api/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        error_page 502 503 504 = @backend_unavailable;
    }

    # ---------- System Controller: /control-api/* ----------
    # /control-api/status                      -> /api/v1/system/status
    # /control-api/components/{name}/restart   -> /api/v1/system/components/{name}/restart
    location ^~ /control-api/ {
        proxy_pass http://system-controller-service:8000/api/v1/system/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        error_page 502 503 504 = @controller_unavailable;
    }

    # Respuestas JSON claras cuando un servicio no responde. Usan la clave
    # "detail", que es la que ya lee el Dashboard en error.response.data.detail.
    location @backend_unavailable {
        default_type application/json;
        return 503 '{"detail":"Backend no disponible"}';
    }

    location @controller_unavailable {
        default_type application/json;
        return 503 '{"detail":"System Controller no disponible"}';
    }

    #  Dashboard (React SPA) 
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}