apiVersion: v1
kind: ServiceAccount
metadata:
  name: system-controller-sa
  namespace: student-aamonsalve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: system-controller-role
  namespace: student-aamonsalve
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system-controller-rolebinding
  namespace: student-aamonsalve
subjects:
  - kind: ServiceAccount
    name: system-controller-sa
    namespace: student-aamonsalve
roleRef:
  kind: Role
  name: system-controller-role
  apiGroup: rbac.authorization.k8s.io
