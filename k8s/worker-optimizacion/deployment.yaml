apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-optimizacion
  namespace: student-aamonsalve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-optimizacion
  template:
    metadata:
      labels:
        app: worker-optimizacion
    spec:
      containers:
      - name: worker-optimizacion
        image: aamonsalve/cryometric-worker-optimizacion:latest
        envFrom:
        - configMapRef:
            name: app-config