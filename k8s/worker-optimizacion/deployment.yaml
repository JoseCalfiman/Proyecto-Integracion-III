apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker-optimizacion
  namespace: student-aamonsalve

spec:
  replicas: 1

  selector:
    matchLabels:
      app: worker-optimizacion

  template:
    metadata:
      labels:
        app: worker-optimizacion

    spec:
      containers:
        - name: worker-optimizacion
          image: aamonsalve/cryometric-worker-optimizacion:latest

          env:
            - name: OPTIMIZATION_RUN_ON_START
              value: "true"

          envFrom:
            - configMapRef:
                name: app-config

          ports:
            - name: health
              containerPort: 8080

          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "320Mi"
