apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: worker-predictivo
  namespace: student-aamonsalve

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-predictivo

  minReplicas: 1
  maxReplicas: 3

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30

    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60