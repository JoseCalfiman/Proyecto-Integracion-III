apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-predictivo
  namespace: student-aamonsalve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-predictivo
  template:
    metadata:
      labels:
        app: worker-predictivo
    spec:
      initContainers:
      - name: wait-for-timescaledb
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          echo "Esperando a TimescaleDB..."
          until nc -z timescaledb-service 5432; do
            echo "TimescaleDB no disponible, esperando 5s..."
            sleep 5
          done
          echo "TimescaleDB disponible!"
      containers:
      - name: worker-predictivo
        image: tiusko/cryometric-worker-predictivo:latest
        ports:
        - containerPort: 8000

        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          failureThreshold: 30

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5

        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"