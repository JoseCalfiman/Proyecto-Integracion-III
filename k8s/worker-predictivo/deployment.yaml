apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-predictivo
  namespace: student-aamonsalve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-predictivo
  template:
    metadata:
      labels:
        app: worker-predictivo
    spec:
      initContainers:
      - name: wait-for-timescaledb
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          echo "Esperando a TimescaleDB..."
          until nc -z timescaledb-service 5432; do
            echo "TimescaleDB no disponible, esperando 5s..."
            sleep 5
          done
          echo "TimescaleDB disponible!"
      containers:
      - name: worker-predictivo
        image: aamonsalve/cryometric-worker-predictivo:latest
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "150m"
            memory: "128Mi"